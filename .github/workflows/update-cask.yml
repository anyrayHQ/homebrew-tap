name: Update anyray-connect cask

# Keep Casks/anyray-connect.rb pinned to the latest anyrayHQ/install release,
# using this repo's own GITHUB_TOKEN — no cross-repo PAT or GitHub App needed.
# The cask FORMAT lives once in anyrayHQ/install (homebrew/anyray-connect.rb.tmpl);
# this only substitutes the version and the pkg's published SHA-256, so the two
# can never disagree on shape.
on:
  schedule:
    - cron: '17 * * * *'        # hourly; a no-op unless a new release landed
  workflow_dispatch: {}
  repository_dispatch:
    types: [anyray-connect-release]

permissions:
  contents: write

concurrency: update-cask

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Render the cask from the latest release and commit if it changed
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_REPO: anyrayHQ/install
        run: |
          set -euo pipefail

          # Latest published version, from the releases/latest redirect target.
          location="$(curl -fsSInc - "https://github.com/${INSTALL_REPO}/releases/latest" \
            | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}' | tail -n1)"
          version="$(printf '%s' "$location" | sed -nE 's#.*/releases/tag/connect-v([0-9][0-9A-Za-z.-]*)$#\1#p')"
          if [ -z "$version" ]; then
            echo "::error::could not resolve the latest connect version from '$location'"
            exit 1
          fi
          base="https://github.com/${INSTALL_REPO}/releases/download/connect-v${version}"

          # The pkg's published SHA-256 — the exact bytes brew will verify.
          sums="$(curl -fsSL "${base}/SHA256SUMS")"
          sha="$(printf '%s\n' "$sums" | awk '$2=="anyray-connect.pkg"{print $1}')"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::no valid SHA-256 for anyray-connect.pkg in ${version} SHA256SUMS"
            exit 1
          fi

          # One source of truth for the cask shape: the template in install.
          tmpl="$(curl -fsSL "https://raw.githubusercontent.com/${INSTALL_REPO}/main/homebrew/anyray-connect.rb.tmpl")"
          # `printf '%s\\n'` guarantees a trailing newline even though the
          # template lacks one — otherwise every run would see a phantom
          # "\ No newline at end of file" diff and re-commit forever.
          printf '%s\n' "$tmpl" \
            | sed -e "s/__VERSION__/${version}/g" -e "s/__SHA256__/${sha}/g" \
            > Casks/anyray-connect.rb

          if git diff --quiet -- Casks/anyray-connect.rb; then
            echo "Cask already at ${version}; nothing to do."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -aqm "anyray-connect ${version}"
          git push
          echo "Updated cask to ${version}."
